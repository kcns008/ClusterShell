# Multi-model: Multiple vLLM deployments with llm-d routing
apiVersion: v1
kind: Namespace
metadata:
  name: clustershell-inference
  labels:
    app.kubernetes.io/part-of: clustershell
---
# -- Model A: Llama 3.1 8B (fast, cheap)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-llama-8b
  namespace: clustershell-inference
  labels:
    app: vllm-llama-8b
    model: llama-3.1-8b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vllm-llama-8b
  template:
    metadata:
      labels:
        app: vllm-llama-8b
        model: llama-3.1-8b
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - --model
            - meta-llama/Llama-3.1-8B-Instruct
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --max-model-len
            - "8192"
            - --gpu-memory-utilization
            - "0.9"
            - --dtype
            - auto
            - --enable-prefix-caching
          ports:
            - containerPort: 8000
          resources:
            requests:
              nvidia.com/gpu: 1
              cpu: "4"
              memory: "16Gi"
            limits:
              nvidia.com/gpu: 1
              cpu: "8"
              memory: "32Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-llama-8b
  namespace: clustershell-inference
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: vllm-llama-8b
---
# -- Model B: Qwen 2.5 7B (alternative small model)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen-7b
  namespace: clustershell-inference
  labels:
    app: vllm-qwen-7b
    model: qwen-2.5-7b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-qwen-7b
  template:
    metadata:
      labels:
        app: vllm-qwen-7b
        model: qwen-2.5-7b
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - --model
            - Qwen/Qwen2.5-7B-Instruct
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --max-model-len
            - "8192"
            - --gpu-memory-utilization
            - "0.9"
            - --dtype
            - auto
          ports:
            - containerPort: 8000
          resources:
            requests:
              nvidia.com/gpu: 1
              cpu: "4"
              memory: "16Gi"
            limits:
              nvidia.com/gpu: 1
              cpu: "8"
              memory: "32Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen-7b
  namespace: clustershell-inference
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: vllm-qwen-7b
---
# -- Model C: CodeLlama 13B (code-focused)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-codellama-13b
  namespace: clustershell-inference
  labels:
    app: vllm-codellama-13b
    model: codellama-13b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-codellama-13b
  template:
    metadata:
      labels:
        app: vllm-codellama-13b
        model: codellama-13b
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - --model
            - codellama/CodeLlama-13b-Instruct-hf
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --max-model-len
            - "16384"
            - --gpu-memory-utilization
            - "0.9"
            - --dtype
            - auto
          ports:
            - containerPort: 8000
          resources:
            requests:
              nvidia.com/gpu: 1
              cpu: "4"
              memory: "16Gi"
            limits:
              nvidia.com/gpu: 1
              cpu: "8"
              memory: "32Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-codellama-13b
  namespace: clustershell-inference
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: vllm-codellama-13b
---
# -- llm-d Router: routes to backends by model name
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-router
  namespace: clustershell-inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-d-router
  template:
    metadata:
      labels:
        app: llm-d-router
    spec:
      containers:
        - name: router
          image: ghcr.io/llm-d/llm-d-routing-proxy:v0.7.0
          ports:
            - containerPort: 8000
          env:
            - name: VLLM_BACKEND_URLS
              value: "http://vllm-llama-8b.clustershell-inference.svc:8000,http://vllm-qwen-7b.clustershell-inference.svc:8000,http://vllm-codellama-13b.clustershell-inference.svc:8000"
            - name: ROUTING_STRATEGY
              value: "prefix-cache-aware"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: llm-d-router
  namespace: clustershell-inference
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: llm-d-router
